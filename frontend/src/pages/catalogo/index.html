<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Além da Estante | Catálogo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/pages/catalogo/catalogo.js"></script>
  </head>
  <body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
    <app-header></app-header>
    <main class="max-w-7xl mx-auto w-full px-4 md:px-6 py-10 flex-1">
      <header class="border-b border-outline/50 pb-5 mb-6">
        <p class="text-xs font-bold tracking-widest text-sage uppercase">Além da Estante</p>
        <h1 class="text-3xl font-serif font-bold text-navy mt-2">Catálogo de livros</h1>
        <p class="text-sm text-muted mt-2">Livros disponíveis conforme o catálogo da loja.</p>
      </header>
      <p id="catalog-status" class="text-sm text-muted py-4" role="status" aria-live="polite">Carregando livros…</p>
      <section id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" aria-label="Livros"></section>
      <nav id="catalog-pagination" class="mt-8 flex items-center justify-center gap-3" aria-label="Paginação do catálogo" hidden></nav>
    </main>
    <app-footer></app-footer>
  </body>
</html>

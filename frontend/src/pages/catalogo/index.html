<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Além da Estante | Catálogo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/pages/catalogo/catalogo.js"></script>
  </head>
  <body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
    <app-header></app-header>
    <main id="main-content" class="max-w-7xl mx-auto w-full px-4 md:px-6 py-10 flex-1">
      <header class="border-b border-outline/50 pb-5 mb-6">
        <p class="text-xs font-bold tracking-widest text-sage uppercase">Além da Estante</p>
        <h1 class="text-3xl font-serif font-bold text-navy mt-2">Catálogo de livros</h1>
        <p class="text-sm text-muted mt-2">Livros disponíveis conforme o catálogo da loja.</p>
      </header>
      <form id="catalog-filters" class="bg-surface rounded-2xl border border-outline/50 p-4 sm:p-5 mb-6" role="search">
        <div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_220px_220px_auto] gap-3 items-end">
          <label class="block text-sm font-semibold text-ink">Buscar livro
            <input id="catalog-search" type="search" placeholder="Título ou descrição" autocomplete="off" class="mt-1.5 w-full rounded-lg border border-outline bg-surface-soft px-3 py-2.5 text-sm" />
          </label>
          <label class="block text-sm font-semibold text-ink">Categoria
            <select id="catalog-category" class="mt-1.5 w-full rounded-lg border border-outline bg-surface-soft px-3 py-2.5 text-sm">
              <option value="">Todas as categorias</option>
            </select>
          </label>
          <label class="block text-sm font-semibold text-ink">Ordenar por
            <select id="catalog-sort" class="mt-1.5 w-full rounded-lg border border-outline bg-surface-soft px-3 py-2.5 text-sm">
              <option value="relevancia">Relevância</option>
              <option value="nome">Nome</option>
              <option value="preco_asc">Menor preço</option>
              <option value="preco_desc">Maior preço</option>
              <option value="recentes">Mais recentes</option>
            </select>
          </label>
          <button id="clear-filters" type="button" class="rounded-lg border border-outline px-4 py-2.5 text-sm font-semibold text-navy hover:bg-surface-soft">Limpar filtros</button>
        </div>
      </form>
      <p id="catalog-status" class="text-sm text-muted py-4" role="status" aria-live="polite">Carregando livros…</p>
      <section id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" aria-label="Livros"></section>
      <nav id="catalog-pagination" class="mt-8 flex items-center justify-center gap-3" aria-label="Paginação do catálogo" hidden></nav>
    </main>
    <app-footer></app-footer>
  </body>
</html>

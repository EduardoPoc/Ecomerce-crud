<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Além da Estante | Criar conta</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/pages/cadastro/cadastro.js"></script>
  </head>
  <body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
    <app-header></app-header>
    <main class="max-w-md mx-auto w-full px-4 py-12 flex-1">
      <section class="bg-surface rounded-2xl border border-outline/50 p-6 shadow-card">
        <a href="/login/" class="text-sm text-sage hover:text-navy">← Voltar para login</a>
        <h1 class="text-3xl font-serif font-bold text-navy mt-5">Criar conta</h1>
        <p class="text-sm text-muted mt-2">Cadastre-se para salvar sua sacola e acompanhar pedidos.</p>
        <form id="signup-form" class="space-y-4 mt-6">
          <p id="signup-message" class="hidden rounded-lg border px-3 py-2.5 text-sm" role="alert"></p>
          <input id="nome" required minlength="2" placeholder="Nome completo" class="w-full rounded-lg border border-outline bg-surface-soft px-3 py-2.5 text-sm" />
          <input id="email" required type="email" placeholder="seu@email.com" class="w-full rounded-lg border border-outline bg-surface-soft px-3 py-2.5 text-sm" />
          <input id="senha" required minlength="8" type="password" placeholder="Senha (mínimo 8 caracteres)" class="w-full rounded-lg border border-outline bg-surface-soft px-3 py-2.5 text-sm" />
          <button id="signup-submit" type="submit" class="w-full rounded-lg bg-navy text-surface px-4 py-3 text-sm font-semibold">Criar conta</button>
        </form>
      </section>
    </main>
    <app-footer></app-footer>
  </body>
</html>

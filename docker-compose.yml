version: '3.8'

services:
  # FrankenPHP server
  frankenphp:
    image: dunglas/frankenphp:php8.3
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
      - ./api:/var/www/api
      - ./docker/frankenphp/config.yaml:/etc/frankenphp/config.yaml
    environment:
      - SERVER_NAME=localhost
      - ENV=dev
    depends_on:
      - db

  # MySQL database
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: book_library
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  db_data: